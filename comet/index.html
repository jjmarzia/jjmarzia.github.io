<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comet Backup for macOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --accent: #00d4aa;
            --accent-hover: #00f5c4;
            --accent-glow: rgba(0, 212, 170, 0.3);
            --text-primary: #f0f4f8;
            --text-secondary: #8892a6;
            --border: #2a3548;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* Radial glow */
        body::after {
            content: '';
            position: fixed;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(0, 212, 170, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 540px;
            width: 100%;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 
                0 0 0 1px rgba(255,255,255,0.03),
                0 20px 50px -20px rgba(0,0,0,0.5);
            animation: fadeUp 0.6s ease-out;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--accent) 0%, #00a388 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.75rem;
            box-shadow: 0 8px 32px var(--accent-glow);
        }

        .icon-wrapper svg {
            width: 36px;
            height: 36px;
            fill: var(--bg-primary);
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .version {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            color: var(--accent);
            background: rgba(0, 212, 170, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 1.25rem;
        }

        .description {
            color: var(--text-secondary);
            font-size: 1.0625rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 1.125rem 2rem;
            background: linear-gradient(135deg, var(--accent) 0%, #00b894 100%);
            color: var(--bg-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 1.0625rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .download-btn:hover {
            background: linear-gradient(135deg, var(--accent-hover) 0%, #00d4aa 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .download-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .meta {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1.75rem;
            padding-top: 1.75rem;
            border-top: 1px solid var(--border);
        }

        .meta-item {
            text-align: center;
        }

        .meta-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.25rem;
        }

        .meta-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9375rem;
            color: var(--text-primary);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid rgba(0, 212, 170, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 100px;
            font-size: 0.8125rem;
            color: var(--accent);
            margin-top: 2rem;
        }

        .badge svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8125rem;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 2rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .meta {
                gap: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
                </svg>
            </div>

            <h1>Comet Backup</h1>
            <span class="version">v25.5.4</span>

            <p class="description">
                Fast, secure cloud backup for macOS. Protect your files with enterprise-grade encryption and seamless background syncing.
            </p>

            <a href="/downloads/Comet%20Backup%2025.5.4-signed.pkg" class="download-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
                Download for macOS
            </a>

            <div class="meta">
                <div class="meta-item">
                    <div class="meta-label">Size</div>
                    <div class="meta-value">38 MB</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Platform</div>
                    <div class="meta-value">macOS</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Arch</div>
                    <div class="meta-value">Universal</div>
                </div>
            </div>

            <div style="text-align: center;">
                <span class="badge">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
                    </svg>
                    Signed & Notarized by Apple
                </span>
            </div>
        </div>

        <p class="footer">
            Questions? Contact <a href="mailto:jjmarzia@buffalo.edu">jjmarzia@buffalo.edu</a>
        </p>
    </div>
</body>
</html>
