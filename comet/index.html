<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comet Backup</title>
  <link rel="icon" href="/assets/starFavicon.ico" type="image/x-icon">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      width: 100%;
      background-color: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 400;
      margin: 0 0 0.5rem 0;
      letter-spacing: -0.02em;
    }

    .version {
      font-size: 0.875rem;
      color: #666;
      margin-bottom: 2.5rem;
    }

    a.download {
      color: white;
      text-decoration: none;
      font-size: 1rem;
      padding: 0.75rem 2rem;
      border: 1px solid #333;
      border-radius: 4px;
      transition: border-color 0.2s;
    }

    a.download:hover {
      border-color: #666;
    }

    .tim-btn {
      background: none;
      border: 1px solid #222;
      color: #555;
      font-family: inherit;
      font-size: 0.75rem;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 2rem;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tim-btn:hover {
      border-color: #444;
      color: #888;
    }

    .tim-btn.playing {
      border-color: #0f0;
      color: #0f0;
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; }
    }

    .meta {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="tim-btn" id="timBtn" onclick="praiseForTim()">
      🔊 Message for Tim
    </button>
    <h1>Comet Backup</h1>
    <p class="version">v25.5.4 · macOS · 75 MB · v4 · Jan 5</p>
    <a href="/downloads/Comet%20Backup%2025.5.4-signed.pkg" class="download">Download</a>
    <p class="meta">Signed & Notarized</p>
  </div>
<script>
  function praiseForTim() {
    const btn = document.getElementById('timBtn');
    const synth = window.speechSynthesis;
    
    // Cancel any ongoing speech
    synth.cancel();
    
    const phrases = [
      "Attention. This is an important broadcast.",
      "All hail Ditto Platinum.",
      "Powered by Pixamation dot com.",
      "The superior backup solution.",
      "Tim, you are a legend.",
      "Ditto Platinum. Excellence. Delivered.",
    ];
    
    btn.classList.add('playing');
    
    let index = 0;
    function speakNext() {
      if (index < phrases.length) {
        const utter = new SpeechSynthesisUtterance(phrases[index]);
        utter.rate = 0.85;
        utter.pitch = 0.3;
        
        // Try to get a robotic voice
        const voices = synth.getVoices();
        const robotVoice = voices.find(v => 
          v.name.includes('Samantha') || 
          v.name.includes('Alex') || 
          v.name.includes('Fred') ||
          v.name.includes('Zarvox') ||
          v.name.includes('Cellos')
        ) || voices[0];
        if (robotVoice) utter.voice = robotVoice;
        
        utter.onend = () => {
          index++;
          setTimeout(speakNext, 200);
        };
        synth.speak(utter);
      } else {
        btn.classList.remove('playing');
      }
    }
    
    // Ensure voices are loaded
    if (synth.getVoices().length === 0) {
      synth.onvoiceschanged = speakNext;
    } else {
      speakNext();
    }
  }
</script>
</body>
</html>
