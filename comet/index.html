<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comet Backup</title>
  <link rel="icon" href="/assets/starFavicon.ico" type="image/x-icon">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      width: 100%;
      background-color: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 400;
      margin: 0 0 0.5rem 0;
      letter-spacing: -0.02em;
    }

    .version {
      font-size: 0.875rem;
      color: #666;
      margin-bottom: 2.5rem;
    }

    a.download {
      color: white;
      text-decoration: none;
      font-size: 1rem;
      padding: 0.75rem 2rem;
      border: 1px solid #333;
      border-radius: 4px;
      transition: border-color 0.2s;
    }

    a.download:hover {
      border-color: #666;
    }

    .tim-btn {
      background: none;
      border: 1px solid #222;
      color: #555;
      font-family: inherit;
      font-size: 0.75rem;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 2rem;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tim-btn:hover {
      border-color: #444;
      color: #888;
    }

    .tim-btn.playing {
      border-color: #0f0;
      color: #0f0;
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; }
    }

    .meta {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="tim-btn" id="timBtn" onclick="praiseForTim()">
      🔊 All hail Pixamation
    </button>
    <h1>Comet Backup</h1>
    <p class="version">v25.5.4 · macOS · 75 MB · v4 · Jan 5</p>
    <a href="/downloads/Comet%20Backup%2025.5.4-signed.pkg" class="download">Download</a>
    <p class="meta">Signed & Notarized</p>
  </div>
<script>
  let audioCtx = null;
  let distortionNode = null;
  
  function makeDistortionCurve(amount) {
    const samples = 44100;
    const curve = new Float32Array(samples);
    const deg = Math.PI / 180;
    for (let i = 0; i < samples; i++) {
      const x = (i * 2) / samples - 1;
      curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
    }
    return curve;
  }
  
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      distortionNode = audioCtx.createWaveShaper();
      distortionNode.curve = makeDistortionCurve(50);
      distortionNode.oversample = '4x';
      distortionNode.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }
  
  function praiseForTim() {
    const btn = document.getElementById('timBtn');
    const synth = window.speechSynthesis;
    
    synth.cancel();
    initAudio();
    
    const phrases = [
      "Attention. This is an important broadcast.",
      "All hail Ditto Platinum.",
      "Powered by Pixamation dot com.",
      "The superior backup solution.",
      "Tim, you are a legend.",
      "Ditto Platinum. Excellence. Delivered.",
    ];
    
    btn.classList.add('playing');
    
    const robotConfigs = [
      { rate: 0.8, pitch: 0.1, delay: 0 },
      { rate: 0.85, pitch: 0.3, delay: 50 },
      { rate: 0.75, pitch: 0.2, delay: 100 },
    ];
    
    let completedCount = 0;
    const totalUtterances = phrases.length * robotConfigs.length;
    
    function speakPhrase(phrase, config, onComplete) {
      setTimeout(() => {
        const utter = new SpeechSynthesisUtterance(phrase);
        utter.rate = config.rate;
        utter.pitch = config.pitch;
        utter.volume = 0.7;
        
        const voices = synth.getVoices();
        const robotVoices = voices.filter(v => 
          v.name.includes('Fred') ||
          v.name.includes('Zarvox') ||
          v.name.includes('Trinoids') ||
          v.name.includes('Cellos') ||
          v.name.includes('Whisper') ||
          v.name.includes('Bad News')
        );
        
        if (robotVoices.length > 0) {
          utter.voice = robotVoices[Math.floor(Math.random() * robotVoices.length)];
        }
        
        utter.onend = onComplete;
        synth.speak(utter);
      }, config.delay);
    }
    
    let index = 0;
    function speakNextChorus() {
      if (index < phrases.length) {
        let finishedInChorus = 0;
        
        robotConfigs.forEach(config => {
          speakPhrase(phrases[index], config, () => {
            finishedInChorus++;
            completedCount++;
            
            if (finishedInChorus === robotConfigs.length) {
              index++;
              setTimeout(speakNextChorus, 300);
            }
            
            if (completedCount >= totalUtterances) {
              btn.classList.remove('playing');
            }
          });
        });
      }
    }
    
    if (synth.getVoices().length === 0) {
      synth.onvoiceschanged = speakNextChorus;
    } else {
      speakNextChorus();
    }
  }
</script>
</body>
</html>
